services:
  - type: web
    name: sahayi
    runtime: docker
    plan: free
    branch: feat/sahayi-deployment
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SAHAYI_AGENT_ENABLED
        value: "false"
